second_layer:
  type: tune
  tune_type: categorical
  params:
    name: { type: value, value: second_layer }
    choices: { type: list, value: [{type: value, value: 16}, {type: value, value: 24}, {type: value, value: 32}] }
third_layer:
  type: tune
  tune_type: categorical
  params:
    name: { type: value, value: third_layer }
