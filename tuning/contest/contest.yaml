# Config for deeparguing.contest.contest_all.
#
# Values below are the winning config found by an earlier grid search (see
# git history -- the sweep script itself has since been removed): k=3 (the
# algorithm's default), margin=0.001 -- cleared 19/100 misclassified samples
# with zero risky (near/exact-tie) clears, and holds flat across margin
# 0.0001-0.001, i.e. this is the actual ceiling along the margin axis for
# this checkpoint, not a lucky pick from a coarse grid.
#
# Any CLI flag passed to contest_all.py overrides the corresponding value
# here (e.g. `--k 10` for a one-off run without editing this file).

# Dataset / checkpoint paths. Bare filenames (no directory component) are
# resolved via deeparguing.output_paths: today's outputs/<date>/ folder if
# the file is there, else the most recent earlier date folder that has it.
checkpoint: model_checkpoint.pt
qbaf: misclassified_qbaf.json
num_samples: null  # null = use every misclassified sample in qbaf

# batch_contest hyperparameters.
k: 3
threshold: 0.5
margin: 0.001
max_iters: 50
tol: 0.0001
max_edits: null  # null = unbounded edit budget
batch_size: null  # null = full-batch (mini-batching consistently underperformed in sweeps)
divergence_bound: 100.0
alpha_init: 1.0  # larger values consistently hurt in sweeps -- see git history
max_backtracks: 10

# Run/output settings.
device: null  # null = auto-detect cuda if available, else cpu
log_dir: null  # null = today's outputs/<date>/ folder
save_checkpoint: null  # null = default to '<log_dir>/<checkpoint_filename>'; "" to skip saving
